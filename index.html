  else if(tab === "ruler"){
    scene = rulerScene(state.ruler);
    noteEl.textContent = RULER[state.ruler].name;
    railHtml =
      panel("揀一種", '<div class="opts">' + Object.keys(RULER).map(k =>
        '<button data-act="rl:' + k + '" aria-pressed="' + (state.ruler === k) + '">' + RULER[k].name + '</button>').join("") + '</div>') +
      stem("尺規作圖：只准用沒有刻度的直尺和圓規，作圖痕跡要保留。") +
      panel("四步", RULER[state.ruler].steps.map((x,i) =>
        '<div class="rule"><i>' + (i+1) + '</i><span>' + x + '</span></div>').join("")) +
      panel("常見扣分位", rules([
        "圓弧擦走了：<strong>作圖痕跡一定要留</strong>，那是評分的依據。",
        "用直尺上的刻度量長度：尺規作圖只准用圓規移動長度。",
        "射線畫得太短，弧和射線交不到，結果沒有交點。"
      ]));
  }

  else if(tab === "nets"){
    const cells = NETS[state.netKey][state.netIdx];
    const st = netStatus(cells);
    let tones = null, marks = null;
    if(state.pairs && st.ids && st.ok){
      const pairOf = f => "UD".indexOf(f) >= 0 ? 1 : ("NS".indexOf(f) >= 0 ? 2 : 3);
      tones = {}; marks = {};
      cells.forEach((c,i) => {
        const k = c[0] + "," + c[1], n = pairOf(st.ids[i]);
        tones[k] = "p" + n; marks[k] = String(n);
      });
    }
    scene = cubeNetScene(cells, marks, tones);
    noteEl.textContent = state.netKey + " 型　第 " + (state.netIdx+1) + " 種";

    let thumbs = '<div class="netgrid">';
    Object.keys(NETS).forEach(k => {
      thumbs += '<div class="netrow"><span>' + k + '　' + NETS[k].length + ' 種</span><div class="thumbs">';
      NETS[k].forEach((n,i) => {
        thumbs += '<button class="thumb" data-k="' + k + '" data-i="' + i + '" aria-pressed="' +
                  (k === state.netKey && i === state.netIdx) + '" aria-label="' + k + '第' + (i+1) + '種">' +
                  netThumb(n,13) + '</button>';
      });
      thumbs += "</div></div>";
    });
    thumbs += "</div>";

    railHtml =
      panel("選擇展開圖", thumbs) +
      panel("標示", '<div class="opts"><button data-act="pairs" aria-pressed="' + state.pairs +
        '">標出三對相對面</button></div>') +
      panel("要點", rules([
        "六個正方形折得成正方體的擺法，一共只有 <strong>11 種</strong>：一四一 6 種、二三一 3 種、二二二 1 種、三三 1 種。",
        "記住四個類型即可，不必死記十一張圖。",
        "按「標出三對相對面」：同一個號碼、同一種顏色的兩格，折起來就是一對相對面。"
      ]));
  }

  else if(tab === "build"){
    const cells = state.build;
    const st = netStatus(cells);
    let tones = null;
    if(cells.length === 6 && st.ids && !st.ok){
      const count = {}; st.ids.forEach(f => { if(f) count[f] = (count[f] || 0) + 1; });
      tones = {};
      cells.forEach((c,i) => { if(st.ids[i] && count[st.ids[i]] > 1) tones[c[0] + "," + c[1]] = "warn"; });
    }
    scene = cells.length ? cubeNetScene(cells, null, tones) : cubeNetScene([[0,0]]);
    noteEl.textContent = "自由拼砌　6 × 6 網格";
    verdictEl.hidden = false;
    if(cells.length !== 6){ verdictEl.dataset.state = "idle"; verdictEl.textContent = "請先選夠六格"; }
    else if(st.why === "split"){ verdictEl.dataset.state = "bad"; verdictEl.textContent = "六格未連在一起"; }
    else if(st.ok){ verdictEl.dataset.state = "good"; verdictEl.textContent = "折得成"; }
    else { verdictEl.dataset.state = "bad"; verdictEl.textContent = "折不成：有兩格重疊"; }

    let grid = '<div class="builder">';
    for(let y=0;y<6;y++) for(let x=0;x<6;x++){
      const on = cells.some(c => c[0] === x && c[1] === y);
      const bad = tones && tones[x + "," + y] === "warn";
      grid += '<button data-x="' + x + '" data-y="' + y + '" aria-pressed="' + on + '" class="' + (bad ? "bad" : "") +
              '" aria-label="第' + (y+1) + '行第' + (x+1) + '格"></button>';
    }
    grid += '</div><div class="count">已選 ' + cells.length + ' / 6 格</div>';

    railHtml =
      panel("在網格上選六格", grid +
        '<div class="opts" style="margin-top:11px"><button data-act="clear">清空</button>' +
        '<button data-act="tian">田字例子</button><button data-act="ao">凹字例子</button></div>') +
      panel("為甚麼折不成", rules([
        "<strong>田字</strong>：四個正方形圍住一點，折起來必定有兩塊重疊，重疊的兩格會變成紅色。",
        "<strong>凹字</strong>：一排三個、兩端各向上翹起一個，兩邊會撞在一起。",
        "做題次序：① 數夠六格沒有　② 有沒有田字、凹字　③ 最後才對照四個類型。"
      ]));
  }

  rail.innerHTML = railHtml;
  paintMinis();
  bindRail();
  buildControls();
  draw();
}

function bindRail(){
  rail.querySelectorAll(".thumb").forEach(b => b.onclick = () => {
    state.netKey = b.dataset.k; state.netIdx = +b.dataset.i; buildTab();
  });
  rail.querySelectorAll(".builder button").forEach(b => b.onclick = () => {
    const x = +b.dataset.x, y = +b.dataset.y;
    const i = state.build.findIndex(c => c[0] === x && c[1] === y);
    if(i >= 0) state.build.splice(i,1);
    else if(state.build.length < 6) state.build.push([x,y]);
    buildTab();
  });
  const presets = {
    clear: [],
    tian:  [[1,1],[2,1],[3,1],[1,2],[2,2],[3,2]],
    ao:    [[1,1],[3,1],[1,2],[2,2],[3,2],[2,3]]
  };
  rail.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if(a === "pairs"){ state.pairs = !state.pairs; }
    else if(a.indexOf("view:") === 0){ const k = a.slice(5); state.showV[k] = !state.showV[k]; }
    else if(a === "viewsAll"){
      const all = state.showV.front && state.showV.side && state.showV.top;
      state.showV = {front:!all, side:!all, top:!all};
    }
    else if(a.indexOf("solid:") === 0){ state.solid = a.slice(6); }
    else if(a.indexOf("part:") === 0){ const v = a.slice(5); state.part = (state.part === v) ? null : v; }
    else if(a.indexOf("spin:") === 0){ state.spin = a.slice(5); }
    else if(a === "lines"){ state.foldLines = !state.foldLines; }
    else if(a.indexOf("pn:") === 0){ state.prismN = +a.slice(3); }
    else if(a.indexOf("tp:") === 0){ state.twoPt = a.slice(3); }
    else if(a.indexOf("cm:") === 0){ state.crossMode = a.slice(3); }
    else if(a.indexOf("cn:") === 0){ state.countRay = (a.slice(3) === "ray"); }
    else if(a.indexOf("ck:") === 0){ state.cake3 = a.slice(3); }
    else if(a === "q37marks"){ state.q37Marks = !state.q37Marks; }
    else if(a.indexOf("sc:") === 0){ state.segCase = a.slice(3); }
    else if(a.indexOf("rl:") === 0){ state.ruler = a.slice(3); }
    else { state.build = presets[a].map(c => c.slice()); }
    buildTab();
  });
  rail.querySelectorAll("[data-k]:not(.thumb)").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if(tab === "q13") state.q13 = k;
    else if(tab === "q14") state.prism = k;
    else if(tab === "q15") state.q15 = k;
    else if(tab === "q19") state.q19 = k;
    buildTab();
  });
}

/* ==================== 控制列 ==================== */
function buildControls(){
  if(scene.kind === "fold"){
    const ro = scene.readout || {cap:"摺疊角度", value: t => Math.round(ease(t)*90), unit:"°"};
    controls.innerHTML =
      '<div class="readout"><span class="cap">' + ro.cap + '</span>' +
      '<span class="num" id="deg">0</span><span class="unit">' + ro.unit + '</span></div>' +
      '<input type="range" id="slider" min="0" max="1000" value="0" aria-label="摺疊程度">' +
      '<button class="act" id="play">播放</button>' +
      '<button class="act ghost" id="reset">' + (scene.readout ? "重設" : "攤平") + '</button>';
    document.getElementById("slider").addEventListener("input", e => { stopFold(); setT(e.target.value/1000); });
    document.getElementById("play").onclick = () => { if(foldAnim) stopFold(); else playTo(T > 0.5 ? 0 : 1); };
    document.getElementById("reset").onclick = () => { stopFold(); setT(0); };
    setT(0);
  } else {
    currentView = scene.defView || "iso";
    controls.innerHTML = '<div class="viewbtns">' + scene.views.map(v =>
      '<button type="button" data-v="' + v + '" aria-pressed="' + (v === currentView) + '">' +
      VIEW_LABEL[v] + '</button>').join("") + '</div>';
    controls.querySelectorAll("[data-v]").forEach(b => b.onclick = () => goView(b.dataset.v));
    goView(scene.defView || "iso", true);
  }
}

let foldAnim = null;
function setT(v){
  T = Math.max(0, Math.min(1, v));
  const cst = (scene && scene.camStart) || [0, 0];
  const end = (scene && scene.camEnd) || [-0.42, -0.58];
  const sl = document.getElementById("slider"), dg = document.getElementById("deg");
  if(sl) sl.value = Math.round(T*1000);
  if(dg) dg.textContent = (scene.readout ? scene.readout.value(T) : Math.round(ease(T)*90));
  const te = ease(T);
  if(scene && scene.flat){ camBase.rx = 0; camBase.ry = 0; camOff.rx = 0; camOff.ry = 0; }
  else { camBase.rx = cst[0] + (end[0]-cst[0])*te; camBase.ry = cst[1] + (end[1]-cst[1])*te; }
  applyCam();
  draw();
}
function stopFold(){
  if(foldAnim){ cancelAnimationFrame(foldAnim); foldAnim = null; }
  const p = document.getElementById("play"); if(p) p.textContent = "播放";
}
function playTo(target){
  stopFold();
  const from = T, dur = 1600, t0 = performance.now();
  const p = document.getElementById("play"); if(p) p.textContent = "暫停";
  const step = now => {
    const k = Math.min(1, (now - t0)/dur);
    setT(from + (target - from)*k);
    if(k < 1) foldAnim = requestAnimationFrame(step); else stopFold();
  };
  foldAnim = requestAnimationFrame(step);
}

function goView(v, immediate){
  currentView = v;
  controls.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  const target = VIEW_ANGLE[v];
  if(cam.anim){ cancelAnimationFrame(cam.anim); cam.anim = null; }
  const r0 = camBase.rx + camOff.rx, y0 = camBase.ry + camOff.ry;
  camOff.rx = 0; camOff.ry = 0;
  if(immediate){ camBase.rx = target[0]; camBase.ry = target[1]; applyCam(); draw(); return; }
  const dur = 700, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0)/dur), e = ease(k);
    camBase.rx = r0 + (target[0]-r0)*e;
    camBase.ry = y0 + (target[1]-y0)*e;
    applyCam(); draw();
    if(k < 1) cam.anim = requestAnimationFrame(step); else cam.anim = null;
  };
  cam.anim = requestAnimationFrame(step);
}

/* ==================== 輸入 ==================== */
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if(tag === "INPUT" || tag === "SUMMARY") return;
  if(tag === "BUTTON" && e.code === "Space") return;   // 空白鍵留給按鈕本身
  if(e.code === "Space"){
    e.preventDefault();
    if(scene.kind === "fold"){ if(foldAnim) stopFold(); else playTo(T > 0.5 ? 0 : 1); }
    else {
      const i = scene.views.indexOf(currentView);
      goView(scene.views[(i+1) % scene.views.length]);
    }
  }
  if(e.code === "ArrowRight" || e.code === "PageDown"){
    e.preventDefault();
    if(scene.kind === "fold"){ stopFold(); setT(T + 0.1); }
    else { const i = scene.views.indexOf(currentView); goView(scene.views[(i+1) % scene.views.length]); }
  }
  if(e.code === "ArrowLeft" || e.code === "PageUp"){
    e.preventDefault();
    if(scene.kind === "fold"){ stopFold(); setT(T - 0.1); }
    else { const i = scene.views.indexOf(currentView); goView(scene.views[(i+scene.views.length-1) % scene.views.length]); }
  }
});

cv.addEventListener("pointerdown", e => {
  if(scene && scene.flat) return;
  dragOn = true; lastX = e.clientX; lastY = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if(!dragOn || (scene && scene.flat)) return;
  const dx = (e.clientX - lastX)*0.008, dy = (e.clientY - lastY)*0.008;
  lastX = e.clientX; lastY = e.clientY;
  camOff.rx = Math.max(-1.6, Math.min(1.6, camOff.rx + dy));
  camOff.ry += dx;
  applyCam();
  draw();
});
["pointerup","pointercancel","pointerleave"].forEach(k => cv.addEventListener(k, () => dragOn = false));

document.getElementById("resetAll").onclick = () => {
  camOff.rx = 0; camOff.ry = 0;
  buildTab();
};

new ResizeObserver(() => draw()).observe(cv);
buildTab();
</script>
